:root{
  --green:#00c300;--green-600:#00a800;--green-700:#008200;--green-100:#f0fcf0;--green-200:#d9f6d9;
  --lime:#ddff44;--blue:#0066ee;--red:#c01313;--red-soft:#fff1f1;--orange:#ff8811;--orange-text:#b74e08;--orange-soft:#fff6ed;
  --pink:#ffaee3;--purple:#8c97ff;--sky:#c0edff;--ink:#131313;
  --bg:#fff;--card:#fff;--subtle:#f3f3f3;--line:#d3d3d3;--fg:#131313;--muted:#535353;--h1:#00a800;--good:#008200;--bad:#c01313;--warn:#b74e08;--link:#0066ee;
  --shadow:0 3px 30px 0 #0000001a;--shadow-hover:0 3px 30px 0 #0003;--track:#e3e3e3;--fixbg:#f0fcf0;--bar:#333;
  --ease:cubic-bezier(.33,1,.68,1);
  --font:KPN-Extended,-apple-system,BlinkMacSystemFont,Roboto,Oxygen-Sans,Ubuntu,Cantarell,Helvetica Neue,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131313;--card:#232323;--subtle:#232323;--line:#333;--fg:#fff;--muted:#b3b3b3;--h1:#00c300;--good:#74e65c;--bad:#ff7474;--warn:#ffae4c;--link:#87bbff;
  --shadow:0 0 0 1px #333;--shadow-hover:0 0 0 1px #535353;--track:#333;--fixbg:#1e3b1e;--bar:#d3d3d3;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131313;--card:#232323;--subtle:#232323;--line:#333;--fg:#fff;--muted:#b3b3b3;--h1:#00c300;--good:#74e65c;--bad:#ff7474;--warn:#ffae4c;--link:#87bbff;
  --shadow:0 0 0 1px #333;--shadow-hover:0 0 0 1px #535353;--track:#333;--fixbg:#1e3b1e;--bar:#d3d3d3;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--font);-webkit-font-smoothing:antialiased;font-variant-ligatures:none}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{width:100%;max-width:1200px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
code,.mono{font-family:var(--mono);font-size:.875rem}

/* Bovenstrook en navigatie: groene strook, witte balk, stip die uitgroeit tot lijn */
.strip{background:var(--green);color:var(--ink);font-size:.8125rem}
.strip .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 24px;min-height:40px}
.top{position:sticky;top:0;z-index:600;background:var(--bg);border-bottom:4px solid transparent;transition:border-color .2s ease-in-out}
.top.scrolled{border-bottom-color:var(--green)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:4px 40px;min-height:72px}
.brand{display:flex;align-items:center;gap:12px;color:var(--fg);font-weight:900;font-size:1.125rem}
.brand:hover{text-decoration:none}.brand img{height:32px;width:auto;display:block}
.menu{display:flex;flex-wrap:wrap;gap:0 24px}
.menu a{position:relative;display:block;padding:12px 0;color:var(--fg);font-size:.9375rem}
.menu a:hover{text-decoration:none}
.menu a::after{content:"";position:absolute;bottom:6px;left:50%;translate:-50%;width:0;height:4px;border-radius:2px;background:var(--green)}
.menu a:hover::after,.menu a:focus-visible::after{animation:menuItemHover .25s ease-in forwards}
.menu a[aria-current="page"]::after{width:100%;animation:none}
@keyframes menuItemHover{0%,60%{width:4px}to{width:100%}}

/* Segmented control: limoen indicator schuift mee */
.seg{position:relative;display:inline-flex;max-width:100%;overflow-x:auto;background:var(--card);border-radius:9999px;box-shadow:var(--shadow);padding:4px}
.seg button{position:relative;z-index:1;border:0;background:none;color:var(--fg);font:inherit;font-size:.875rem;padding:8px 18px;min-height:40px;border-radius:9999px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{color:var(--ink);font-weight:700}
.seg i{position:absolute;top:4px;bottom:4px;left:0;width:0;background:var(--lime);border-radius:9999px;transition:transform .3s var(--ease),width .3s var(--ease)}
.strip .seg{background:transparent;box-shadow:none;padding:2px}
.strip .seg button{color:var(--ink);padding:2px 12px;min-height:26px;font-size:.8125rem}
.strip .seg i{top:2px;bottom:2px}

/* Inhoud */
main{padding-block:32px 72px}
.view{display:flex;flex-direction:column;gap:32px;animation:fadeIn .2s ease-in-out}
@keyframes fadeIn{0%{opacity:0}to{opacity:1}}
h1{margin:0;color:var(--h1);font-size:clamp(2.25rem,5vw,3.5rem);line-height:1.06;font-weight:900;letter-spacing:-.005em;text-wrap:balance}
h2{margin:0;font-size:1.5rem;line-height:1.17;font-weight:900;text-wrap:balance}
.lede{margin:8px 0 0;max-width:68ch;color:var(--fg)}
.note{margin:0;font-size:.8125rem;color:var(--muted);max-width:80ch}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.cards{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:24px;min-width:0;transition:box-shadow .2s ease-in-out,transform .2s ease-in-out}
a.card{display:block;color:inherit}a.card:hover{text-decoration:none;transform:translateY(-2px);box-shadow:var(--shadow-hover)}
.stat{display:flex;flex-direction:column;gap:8px}
.stat .row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;min-height:56px}
.stat svg{width:56px;height:56px;flex:none}
.stat .val{font-size:3rem;line-height:1;font-weight:900;font-variant-numeric:tabular-nums}
.stat .name{font-weight:700}
.stat .sub{font-size:.875rem;color:var(--muted)}
.tag{display:inline-block;border-radius:9999px;padding:2px 12px;font-size:.8125rem;font-weight:700;white-space:nowrap}
.t-blocker{background:var(--red);color:#fff}.t-warning{background:var(--orange);color:var(--ink)}.t-ok{background:var(--green);color:var(--ink)}
.t-info{background:var(--sky);color:var(--ink)}
.t-kan{background:var(--green);color:var(--ink)}.t-deels{background:var(--orange);color:var(--ink)}.t-niet{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1px var(--muted)}
.sample{display:inline-block;border:1px dashed currentColor;border-radius:9999px;padding:0 10px;font-size:.75rem;font-weight:500;white-space:nowrap}

/* Hero: groen vlak met ronde hoeken, grote witte kop, limoen knop */
.hero{background:var(--green-600);color:var(--ink);border-radius:40px;padding:clamp(24px,5vw,56px);display:flex;flex-wrap:wrap;align-items:center;gap:32px}
.hero .txt{flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:12px}
.hero .eyebrow{font-weight:700}
.hero .big{margin:0;color:#fff;font-size:clamp(2.75rem,8vw,5rem);line-height:1;font-weight:900;letter-spacing:-.01em}
.hero p{margin:0;max-width:52ch;font-size:1.125rem}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 28px;border-radius:9999px;font-weight:700;font-size:.9375rem;color:var(--ink);transition:background-color .2s ease-in-out,transform .2s ease-in-out}
.btn:hover{text-decoration:none;transform:translateY(-1px)}
.btn-lime{background:var(--lime)}.btn-lime:hover{background:#edff9a}
.btn-line{box-shadow:inset 0 0 0 2px var(--lime)}.btn-line:hover{background:#00000014}
.ringcard{flex:0 1 300px;min-width:0;max-width:100%;background:var(--card);color:var(--fg);border-radius:32px;padding:24px 32px;display:flex;flex-direction:column;align-items:center;gap:4px;margin-inline:auto}
.ring{position:relative;width:176px;height:176px}
.ring svg{display:block;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:16}
.ring .track{stroke:var(--track)}
.ring .arc{stroke-linecap:round;transition:stroke-dashoffset .5s var(--ease),stroke .5s var(--ease)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:3.5rem;font-weight:900;font-variant-numeric:tabular-nums}
.ringcard small{color:var(--muted);font-size:.875rem;text-align:center}

/* Bevinding: de oplossing valt op, net als de highlight-blokken */
.finding{display:flex;flex-direction:column;gap:12px}
.finding + .finding{border-top:1px solid var(--line);padding-top:20px;margin-top:20px}
.finding .t{font-weight:700;font-size:1.125rem;line-height:1.35;overflow-wrap:anywhere}
.fix{background:var(--fixbg);border-radius:12px;padding:12px 16px;display:flex;gap:12px;align-items:flex-start}
.fix svg{flex:none;width:24px;height:24px;margin-top:0}
.live{display:inline-flex;align-items:center;gap:8px;font-size:.8125rem}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* Tabellen: om-en-om vlak, ronde kaart eromheen */
.tablebox{overflow-x:auto;background:var(--card);border-radius:20px;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:.9375rem}
th{text-align:left;font-size:.8125rem;font-weight:700;padding:14px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:14px 16px;vertical-align:top;overflow-wrap:anywhere}
tbody tr:nth-child(even){background:var(--subtle)}
tbody tr{transition:background-color .2s ease-in-out}
.lime-box{background:var(--green-600);color:#fff;border-radius:32px;padding:24px 32px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px}
.lime-box b{font-size:3rem;line-height:1;font-weight:900}.lime-box span{color:var(--ink);font-weight:700}

/* Grafieken */
.chart text{font-family:var(--font);font-size:12px;fill:var(--muted)}
.chart text.lab{font-size:13px;font-weight:700;fill:var(--fg)}
.draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.bars{display:flex;flex-direction:column;gap:12px;max-width:760px}
.bar{display:grid;grid-template-columns:130px minmax(0,1fr) 24px;gap:12px;align-items:center;font-size:.9375rem}
.bar div{height:16px;background:var(--track);border-radius:9999px;overflow:hidden}
.bar div i{display:block;height:100%;background:var(--bar);border-radius:9999px;transform-origin:left;animation:grow .5s var(--ease) both}
@keyframes grow{0%{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.draw{stroke-dashoffset:0}}
footer{border-top:1px solid var(--line);padding-block:24px;font-size:.8125rem;color:var(--muted)}
</style>
</head>

<script>
// Live versie van het KPN-ontwerp: alle cijfers komen uit /api/status van de exporter.
// Alleen de pagina's Demo en Wat kan in Perses zijn vaste uitleg.
const PAGES=[['overzicht','Overzicht'],['fixen','Fixen'],['score','Score'],['checks','Checks'],['platform','Platform'],['demo','Demo'],['perses','Wat kan in Perses']];
const LIVE=new Set(['overzicht','fixen','score','checks','platform']);
const REFRESH_MS=15000;
let D=null,fetchedAt=0,lastScore=0,current=null,fxFilter='alle',offline=false;

const tone=v=>v>=100?'var(--green)':v>=50?'var(--orange)':'var(--red)';
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SEV={blocker:'Blocker',warning:'Warning',info:'Info'};
const sevs=sev=>(D?D.findings:[]).filter(f=>f.severity===sev);
const ageNow=()=>D&&D.scanned?D.ageSeconds+Math.round((Date.now()-fetchedAt)/1000):null;
function ageText(s){if(s==null)return '–';if(s<90)return s+' s';if(s<5400)return Math.round(s/60)+' min';return Math.round(s/3600)+' uur'}

// Eigen lijntekeningen in de steunkleuren van de tokens (roze, paars, lichtblauw, groen)
const I={
  shield:'<svg viewBox="0 0 56 56" aria-hidden="true"><path d="M28 6l18 6v14c0 12-8 20-18 24C18 46 10 38 10 26V12z" fill="var(--green)" stroke="currentColor" stroke-width="1.5"/><path d="M15 15l13-4v34c-8-4-13-11-13-19z" fill="var(--pink)"/><path d="M28 6l18 6v14c0 12-8 20-18 24C18 46 10 38 10 26V12z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',
  warn:'<svg viewBox="0 0 56 56" aria-hidden="true"><path d="M28 8l22 38H6z" fill="var(--lime)" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M28 22v12M28 39v1" stroke="#131313" stroke-width="2.5" stroke-linecap="round"/><path d="M6 50h44" stroke="currentColor" stroke-width="1.5"/></svg>',
  list:'<svg viewBox="0 0 56 56" aria-hidden="true"><rect x="12" y="8" width="32" height="40" rx="4" fill="var(--sky)" stroke="currentColor" stroke-width="1.5"/><path d="M19 20l3 3 5-6M19 32l3 3 5-6" fill="none" stroke="#131313" stroke-width="2"/><path d="M31 20h7M31 32h7" stroke="#131313" stroke-width="2"/><path d="M6 52h44" stroke="currentColor" stroke-width="1.5"/></svg>',
  clock:'<svg viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="20" fill="var(--purple)" stroke="currentColor" stroke-width="1.5"/><circle cx="25" cy="28" r="17" fill="var(--bg)"/><path d="M28 16v12l9 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><path d="M6 52h44" stroke="currentColor" stroke-width="1.5"/></svg>',
  node:'<svg viewBox="0 0 56 56" aria-hidden="true"><rect x="10" y="10" width="36" height="12" rx="3" fill="var(--green)" stroke="currentColor" stroke-width="1.5"/><rect x="10" y="26" width="36" height="12" rx="3" fill="var(--pink)" stroke="currentColor" stroke-width="1.5"/><circle cx="17" cy="16" r="2" fill="#131313"/><circle cx="17" cy="32" r="2" fill="#131313"/><path d="M6 46h44" stroke="currentColor" stroke-width="1.5"/></svg>',
  gear:'<svg viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="26" r="16" fill="var(--sky)" stroke="currentColor" stroke-width="1.5"/><circle cx="28" cy="26" r="6" fill="var(--green)" stroke="currentColor" stroke-width="1.5"/><path d="M28 6v6M28 40v6M8 26h6M42 26h6M14 12l4 4M38 36l4 4M42 12l-4 4M18 36l-4 4" stroke="currentColor" stroke-width="2"/><path d="M6 52h44" stroke="currentColor" stroke-width="1.5"/></svg>',
  pdb:'<svg viewBox="0 0 56 56" aria-hidden="true"><rect x="8" y="12" width="40" height="28" rx="14" fill="var(--purple)" stroke="currentColor" stroke-width="1.5"/><circle cx="22" cy="26" r="9" fill="var(--lime)" stroke="currentColor" stroke-width="1.5"/><path d="M6 46h44" stroke="currentColor" stroke-width="1.5"/></svg>',
  api:'<svg viewBox="0 0 56 56" aria-hidden="true"><path d="M20 12h-4a4 4 0 00-4 4v8l-4 4 4 4v8a4 4 0 004 4h4M36 12h4a4 4 0 014 4v8l4 4-4 4v8a4 4 0 01-4 4h-4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="28" cy="28" r="7" fill="var(--pink)" stroke="currentColor" stroke-width="1.5"/></svg>',
  check:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="var(--green)"/><path d="M7 12.5l3.5 3.5L17 9" fill="none" stroke="#131313" stroke-width="2"/></svg>'
};

function ring(v,id,label){const c=2*Math.PI*72;return `<div class="ringcard"><div class="ring"><svg width="176" height="176" viewBox="0 0 176 176" role="img" aria-label="Readiness-score ${v} van 100"><circle class="track" cx="88" cy="88" r="72"/><circle class="arc" id="${id}" cx="88" cy="88" r="72" stroke="${tone(v)}" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-v/100)}"/></svg><b id="${id}-n">${v}</b></div><strong>${label||'Readiness-score'}</strong><small>van 100. Min 25 per blocker, min 5 per warning.</small></div>`}
function animateRing(id,from,to){const arc=document.getElementById(id),n=document.getElementById(id+'-n');if(!arc||reduced||from===to)return;const c=2*Math.PI*72;arc.style.transition='none';arc.setAttribute('stroke-dashoffset',c*(1-from/100));arc.getBoundingClientRect();arc.style.transition='';arc.setAttribute('stroke-dashoffset',c*(1-to/100));const t0=performance.now();(function tick(t){const p=Math.min(1,(t-t0)/500),e=1-Math.pow(1-p,3);n.textContent=Math.round(from+(to-from)*e);if(p<1)requestAnimationFrame(tick)})(t0);
  // Een verborgen tab pauzeert requestAnimationFrame; zonder dit vangnet blijft de teller op de startwaarde staan.
  setTimeout(()=>{n.textContent=to},600)}
const tag=sev=>`<span class="tag t-${sev}">${SEV[sev]||esc(sev)}</span>`;
const fnd=f=>`<div class="finding"><div class="head">${tag(f.severity)}<code style="color:var(--muted);overflow-wrap:anywhere">${esc(f.resource)}</code></div><div class="t">${esc(f.title)}</div><div class="fix">${I.check}<div><strong>Zo los je het op.</strong> ${esc(f.fix)}</div></div></div>`;
function statCard(icon,name,val,sub,color,sample,href){const t=href?'a':'div';return `<${t} class="card stat" ${href?`href="#${href}"`:''}><div class="row">${icon}${sample?'<span class="sample">Voorbeeld</span>':''}</div><div class="val" style="color:${color}">${val}</div><div class="name">${name}</div><div class="sub">${sub}</div></${t}>`}
const okBox=txt=>`<div class="fix" style="align-items:center">${I.check}<span>${txt}</span></div>`;

function waiting(){return `<div class="view"><div><h1>Upgrade readiness</h1><p class="lede">${offline?'Geen verbinding met de exporter. De pagina probeert het elke 15 seconden opnieuw.':'De eerste scan loopt nog. Even geduld, dit duurt meestal minder dan een minuut.'}</p></div></div>`}

function platformCards(linked){const p=D.platform;
  if(!p)return `<section class="cards">${['Blokkerende PDB\'s','Nodes niet Ready','Ongezonde Operators','Verouderde API\'s'].map((n,i)=>statCard([I.pdb,I.node,I.gear,I.api][i],n,'–','Geen platform-metrics: Thanos niet bereikbaar.','var(--muted)',false,linked?'platform':'')).join('')}</section>`;
  const h=linked?'platform':'';
  return `<section class="cards" aria-label="Platform">
  ${statCard(I.pdb,"Blokkerende PDB's",p.blockingPDBs,'Houden node-drains tegen.',p.blockingPDBs?'var(--bad)':'var(--good)',false,h)}
  ${statCard(I.node,'Nodes niet Ready',p.unreadyNodes,p.unreadyNodes?'Ready-condition niet true.':'Elke node is Ready.',p.unreadyNodes?'var(--bad)':'var(--good)',false,h)}
  ${statCard(I.gear,'Ongezonde Operators',p.unhealthyOperators,p.unhealthyOperators?'Down, degraded of unavailable.':'Geen enkele down of degraded.',p.unhealthyOperators?'var(--bad)':'var(--good)',false,h)}
  ${statCard(I.api,"Verouderde API's",p.deprecatedAPIs.length,'Aangeroepen en deprecated.',p.deprecatedAPIs.length?'var(--warn)':'var(--good)',false,h)}
  </section>`}

function overview(){const b=sevs('blocker').length,w=sevs('warning').length,up=D.checks.filter(c=>c.up).length,n=D.checks.length,age=ageNow();
  const failing=n-up;
  const why=b?`${b} ${b>1?'blockers staan':'blocker staat'} de upgrade in de weg${w?`, en ${w} ${w>1?'warnings wil':'warning wil'} je nakijken`:''}. Los ${b>1?'ze':'die'} eerst op, dan stijgt de score.`
    :failing?`Geen blockers, maar ${failing} ${failing>1?'checks konden':'check kon'} niet draaien. Zonder die checks is er geen volledig oordeel.`
    :w?`Geen blockers. ${w} ${w>1?'warnings wil':'warning wil'} je nog nakijken.`:'Geen blockers en alle checks gelukt.';
  const todo=D.findings.filter(f=>f.severity!=='info'),shown=todo.slice(0,6);
  return `<section class="hero"><div class="txt"><div class="eyebrow">Klaar voor de upgrade${D.targetVersion?` naar ${esc(D.targetVersion)}`:''}?</div><p class="big">${D.ready?'Ja.':'Nog niet.'}</p><p>${why}</p><div class="actions"><a class="btn btn-lime" href="#fixen">Bekijk de fixes</a><a class="btn btn-line" href="#checks">Alle checks</a></div></div>${ring(D.score,'r0')}</section>
  <section class="cards" aria-label="Kerncijfers">
  ${statCard(I.shield,'Blockers',b,'Moeten opgelost zijn voordat je upgradet.',b?'var(--bad)':'var(--good)',false,'fixen')}
  ${statCard(I.warn,'Warnings',w,'Nakijken. Houden een upgrade niet per se tegen.',w?'var(--warn)':'var(--good)',false,'fixen')}
  ${statCard(I.list,'Checks gelukt',`${up}/${n}`,failing?`${failing} ${failing>1?'checks konden':'check kon'} niet beoordeeld worden.`:'Alle onderdelen konden beoordeeld worden.',failing?'var(--bad)':'var(--good)',false,'checks')}
  ${statCard(I.clock,'Laatste scan',`<span id="age">${ageText(age)}</span>`,'Geleden. Boven 10 minuten wordt dit rood.',age!=null&&age>600?'var(--bad)':'var(--good)')}
  </section>
  <section class="stack"><h2>Dit eerst oplossen</h2><div class="card">${shown.length?shown.map(fnd).join(''):okBox('Niets op te lossen: geen blockers en geen warnings.')}${todo.length>shown.length?`<p style="margin:20px 0 0"><a href="#fixen">En nog ${todo.length-shown.length} meer: bekijk alles bij Fixen</a></p>`:''}</div></section>
  ${platformCards(true)}`}

function seg(id,items,cur){return `<div class="seg" id="${id}" role="group"><i></i>${items.map(([v,l])=>`<button data-v="${v}" aria-pressed="${v===cur}">${l}</button>`).join('')}</div>`}
function placeSeg(el){const on=el.querySelector('[aria-pressed="true"]'),i=el.querySelector('i');if(!on)return;i.style.width=on.offsetWidth+'px';i.style.transform=`translateX(${on.offsetLeft}px)`}

function fixTable(){const rows=D.findings.filter(f=>fxFilter==='alle'||f.severity===fxFilter);
  if(!rows.length)return okBox(fxFilter==='alle'?'Geen bevindingen: niets te fixen.':'Geen bevindingen met deze ernst.');
  return `<div class="tablebox"><table style="min-width:920px"><thead><tr><th>Ernst</th><th>Categorie</th><th>Resource</th><th>Probleem</th><th>Oplossing</th></tr></thead><tbody>${rows.map(f=>`<tr><td>${tag(f.severity)}</td><td style="white-space:nowrap">${esc(f.category)}</td><td><code>${esc(f.resource)}</code></td><td>${esc(f.title)}</td><td>${esc(f.fix)}</td></tr>`).join('')}</tbody></table></div>`}

function chart(){const h=(D.history||[]).filter(p=>p.t);
  if(h.length<2)return `<p class="note">De grafiek vult zich na een paar scans. De exporter onthoudt de laatste ${180} scans; na een herstart begint hij opnieuw.</p>`;
  const t0=h[0].t,t1=h[h.length-1].t,span=Math.max(1,t1-t0),X=t=>48+(t-t0)/span*736,Y=v=>250-v*2.3;
  let d=`M${X(h[0].t).toFixed(1)} ${Y(h[0].score)}`;for(const p of h.slice(1))d+=`H${X(p.t).toFixed(1)}V${Y(p.score)}`;
  const last=h[h.length-1],mins=Math.round(span/60);
  return `<div style="overflow-x:auto"><svg class="chart" viewBox="0 0 800 290" role="img" aria-label="Score van ${h[0].score} naar ${last.score} in de laatste ${mins} minuten" style="display:block;width:100%;min-width:620px;height:auto">
    <line x1="48" y1="20" x2="784" y2="20" stroke="var(--green-600)" stroke-dasharray="4 4"/><line x1="48" y1="135" x2="784" y2="135" stroke="var(--orange)" stroke-dasharray="4 4"/><line x1="48" y1="250" x2="784" y2="250" stroke="var(--line)"/>
    <text x="40" y="24" text-anchor="end">100</text><text x="40" y="139" text-anchor="end">50</text><text x="40" y="254" text-anchor="end">0</text>
    <path d="${d}V250H48Z" fill="var(--green)" fill-opacity=".12"/>
    <path d="${d}" fill="none" stroke="var(--green)" stroke-width="3"/>
    <circle cx="784" cy="${Y(last.score)}" r="7" fill="var(--lime)" stroke="#131313" stroke-width="2"/>
    <text class="lab" x="770" y="${Math.max(14,Y(last.score)-14)}" text-anchor="end">${last.score}</text>
    <text x="48" y="272">${mins} min geleden</text><text x="784" y="272" text-anchor="end">nu</text></svg></div>`}

const CHECK_INFO={
  clusterversion:['ClusterVersion, admin-gates en admin-acks','Failing, Upgradeable=False','Progressing, onbevestigde admin-gate'],
  operators:['ClusterOperators','Niet Available, Degraded, Upgradeable=False','Progressing'],
  olm:['ClusterServiceVersions, Subscriptions, InstallPlans','Phase niet Succeeded, maxOpenShiftVersion onder de doelversie, mislukte InstallPlan','Update niet op te lossen (ResolutionFailed), catalogus ongezond, update wacht op goedkeuring'],
  nodes:['Nodes, MachineConfigPools','Node niet Ready, MCP Degraded','Pressure, cordoned, MCP paused of niet Updated'],
  pdb:['PodDisruptionBudgets','0 disruptions allowed','PDB matcht geen pods'],
  deprecated_apis:['APIRequestCounts en de platform-metric via Thanos','Gebruikte API verdwijnt in of vóór de doelversie','Gebruikte API verdwijnt later'],
  unsupported:['operator.openshift.io (cluster), Pods','unsupportedConfigOverrides gezet','Losse pod zonder controller']
};

const V={
  overzicht:()=>`<div class="view"><div><h1>Upgrade readiness</h1></div><div class="stack" style="gap:32px">${overview()}</div></div>`,
  fixen:()=>{const c=s=>sevs(s).length;return `<div class="view"><div><h1>Wat moet er gefixt worden</h1><p class="lede">Alle bevindingen van de laatste scan, ernstigste eerst, met per bevinding de oplossing.</p></div><div>${seg('fx',[['alle',`Alles (${D.findings.length})`],['blocker',`Blockers (${c('blocker')})`],['warning',`Warnings (${c('warning')})`],['info',`Info (${c('info')})`]],fxFilter)}</div><div id="fxt">${fixTable()}</div><p class="note">Live uit de exporter. Een opgeloste bevinding verdwijnt bij de volgende scan.</p></div>`},
  score:()=>{const rows=Object.entries(D.categories).map(([n,v])=>[n,(v.blocker||0)+(v.warning||0)]).sort((a,b)=>a[0].localeCompare(b[0])),max=Math.max(1,...rows.map(r=>r[1]));
    return `<div class="view"><div><h1>Score in de tijd</h1><p class="lede">De score stijgt zodra bevindingen zijn opgelost. Elke scan vervangt alle bevindingen.</p></div>
    <section class="card stack"><div class="head"><h2>Sinds de start van de exporter</h2></div>${chart()}
    <p class="note">Stippellijnen: de drempels van de score. Onder 50 rood, vanaf 50 oranje, op 100 groen.</p></section>
    <section class="card stack"><h2>Blockers en warnings per categorie</h2><div class="bars">${rows.map(([n,v])=>`<div class="bar"><span>${esc(n)}</span><div><i style="width:${v/max*100}%"></i></div><strong style="text-align:right">${v}</strong></div>`).join('')}</div></section></div>`},
  checks:()=>{const up=D.checks.filter(c=>c.up).length;return `<div class="view"><div><h1>Status van de checks</h1><p class="lede">Een falende check betekent dat de exporter dit onderdeel niet heeft kunnen beoordelen, meestal door ontbrekende rechten. De andere checks lopen dan door.</p></div>
    <div class="lime-box" ${up<D.checks.length?'style="background:var(--red)"':''}><b>${up} van ${D.checks.length}</b><span ${up<D.checks.length?'style="color:#fff"':''}>checks gelukt</span></div>
    <div class="tablebox"><table style="min-width:860px"><thead><tr><th>Check</th><th>Leest</th><th>Blocker bij</th><th>Warning bij</th><th>Status</th></tr></thead><tbody>${D.checks.map(c=>{const r=CHECK_INFO[c.name]||['','',''];return `<tr><td style="white-space:nowrap"><code>${esc(c.name)}</code></td><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${c.up?'<span class="tag t-ok">OK</span>':'<span class="tag t-blocker">Faalt</span>'}</td></tr>`}).join('')}</tbody></table></div>
    <p class="note">Status: live uit upgrade_readiness_check_up. Bij een falende check staat de oorzaak in de logs van de exporter.</p></div>`},
  platform:()=>{const p=D.platform;return `<div class="view"><div><h1>Ruwe platform-metrics</h1><p class="lede">Rechtstreeks van het platform, via Thanos. Deze metrics tellen ook platform-namespaces mee die de exporter overslaat, dus een verschil met het Overzicht kan kloppen.</p></div>
    ${platformCards(false)}
    ${p&&p.error?`<p class="note" style="color:var(--bad)">Niet alle platform-metrics konden worden opgehaald: ${esc(p.error)}</p>`:''}
    <section class="stack"><h2>Verouderde API's in gebruik</h2>${p&&p.deprecatedAPIs.length?`<div class="tablebox"><table style="min-width:620px"><thead><tr><th>Groep</th><th>Versie</th><th>Resource</th><th>Verdwijnt in</th></tr></thead><tbody>${p.deprecatedAPIs.map(r=>`<tr><td><code>${esc(r.group||'core')}</code></td><td><code>${esc(r.version)}</code></td><td><code>${esc(r.resource)}</code></td><td>${r.removedRelease?`<strong style="color:var(--warn)">${esc(r.removedRelease)}</strong>`:'<span style="color:var(--muted)">niet bekend</span>'}</td></tr>`).join('')}</tbody></table></div>`:okBox(p?'Geen verouderde API\'s in gebruik.':'Geen data: Thanos niet bereikbaar.')}<p class="note">Live uit Thanos, metric apiserver_requested_deprecated_apis.</p></section></div>`},
  demo:()=>`<div class="view"><div><div class="head"><h1>Demo: vóór en na de live fix</h1><span class="sample">Voorbeeld</span></div><p class="lede">Uitleg van het demo-scenario, met cijfers berekend met de scoreformule vanaf een schone beginstand (score 100). Wat er nu echt op het cluster staat, zie je bij Overzicht en Fixen.</p></div>
    <section class="cards"><div class="stack"><h2>Vóór: demo kapot</h2>${ring(65,'rv','Vóór de fix')}</div><div class="stack"><h2>Na: PDB gefixt</h2>${ring(90,'rn','Na de fix')}</div></section>
    <section class="stack"><h2>Speel het stap voor stap af</h2><div>${seg('st',DEMO.map((s,i)=>[String(i),s.step]),'1')}</div><div class="fix" style="background:var(--subtle)"><code id="cmd" style="overflow-wrap:anywhere"></code></div><p id="demotxt" style="margin:0"></p></section></div>`,
  perses:()=>{const R=[
    ['kan','Kleuren uit deze huisstijl','Thresholds en colorMode op de tellers, cellSettings in tabellen, vaste lijnkleur op de grafiek.'],
    ['kan','Scorering','GaugeChart met thresholds en max 100. De vorm kiest Perses.'],
    ['kan','Logo en naam bovenaan','Markdown-paneel. DOMPurify laat afbeeldingen door en de console staat data:-afbeeldingen toe (img-src). Niet in de console gezien.'],
    ['kan','Secties','Grid-layouts met titel, inklapbaar. Platform-metrics starten ingeklapt.'],
    ['kan',"Verouderde API's als tabel",'Paneelsoort Table met dezelfde query.'],
    ['deels','Groen vlak bovenaan','Inline style in het Markdown-paneel kan een vlak en ronde hoeken geven, maar de tekst erin is vast: het kan niet meekleuren met de score.'],
    ['deels','Lange teksten','defaultColumnHeight: auto op de tabel. Effect niet in de console gezien.'],
    ['deels','Tekst op gevulde vlakken','Perses kiest zelf zwart of wit op contrast.'],
    ['deels','Balken per categorie','BarChart heeft geen kleuroptie. Kleur komt uit het console-thema.'],
    ['deels','Sortering op ernst','Alleen alfabetisch op de ruwe waarde: blocker, info, warning.'],
    ['deels','Licht en donker','Volgt het console-thema. Gekozen kleuren zijn in beide modi gelijk.'],
    ['niet','Lettertype KPN Extended','De console laadt alleen zijn eigen lettertype. Een paneel kan geen @font-face toevoegen.'],
    ['niet','Animaties','Geen stip-naar-lijn, schuivende indicator of optellende score: dat vraagt eigen CSS of JavaScript.'],
    ['niet','Hero met knoppen die meekleurt','Een paneel kan geen tekst kiezen op basis van een metric, behalve de Ja/Nee-mapping in een teller.'],
    ['niet',"Losse pagina's en menu",'Eén dashboard is één lange pagina. Secties vervangen hier het menu.']
  ];return `<div class="view"><div><h1>Wat kan in Perses, en wat niet</h1><p class="lede">Daarom bestaat deze pagina: de exporter serveert hem zelf, zodat de volledige huisstijl wel kan. Het Perses-dashboard in de OpenShift-console blijft de officiële weergave.</p></div><div class="tablebox"><table style="min-width:760px"><thead><tr><th>Haalbaar</th><th>In dit ontwerp</th><th>In Perses</th></tr></thead><tbody>${R.map(r=>`<tr><td><span class="tag t-${r[0]}">${{kan:'Kan',deels:'Deels',niet:'Kan niet'}[r[0]]}</span></td><td><strong>${r[1]}</strong></td><td>${r[2]}</td></tr>`).join('')}</tbody></table></div></div>`}
};
const DEMO=[
  {step:'Beginstand',score:100,cmd:'Schoon cluster: geen bevindingen.',txt:'Score 100, antwoord Ja.'},
  {step:'Demo kapot',score:65,cmd:'oc apply -f testcases/demo-kapot.yaml',txt:'1 blocker (PDB) en 2 warnings (PDB zonder pods, losse pod): 100 − 25 − 5 − 5 = 65.'},
  {step:'PDB gefixt',score:90,cmd:'oc patch pdb demo-app -n clusterbusters-demo --type=merge --patch-file=testcases/fix-pdb.yaml',txt:'De blocker is weg, de 2 warnings blijven: 100 − 5 − 5 = 90.'},
  {step:'Opgeruimd',score:100,cmd:'oc delete namespace clusterbusters-demo',txt:'Alles weg: terug naar 100.'}
];

const app=document.getElementById('app'),menu=document.getElementById('menu'),meta=document.getElementById('meta');
menu.innerHTML=PAGES.map(([id,l])=>`<a href="#${id}" data-p="${id}">${l}</a>`).join('');
function bindSeg(id,fn){const el=document.getElementById(id);if(!el)return;placeSeg(el);el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const prev=el.querySelector('[aria-pressed="true"]')?.dataset.v;el.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));placeSeg(el);fn(b.dataset.v,prev)})}
function demoStep(k,prev){const s=DEMO[+k];document.getElementById('cmd').textContent=s.cmd;document.getElementById('demotxt').textContent=s.txt}

// render: bij navigeren naar boven scrollen, bij een live verversing de scrollpositie houden.
function render(nav){const p=PAGES.some(x=>x[0]===location.hash.slice(1))?location.hash.slice(1):'overzicht';
  menu.querySelectorAll('a').forEach(a=>a.dataset.p===p?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
  if(!nav&&!LIVE.has(p))return;
  const y=scrollY;
  app.innerHTML=LIVE.has(p)&&!(D&&D.scanned)?waiting():V[p]();
  if(p==='overzicht'&&D&&D.scanned){animateRing('r0',nav?0:lastScore,D.score)}
  if(p==='demo'){animateRing('rv',0,65);animateRing('rn',0,90);demoStep('1');bindSeg('st',k=>demoStep(k))}
  if(p==='fixen')bindSeg('fx',k=>{fxFilter=k;document.getElementById('fxt').innerHTML=fixTable()});
  current=p;
  if(nav)window.scrollTo(0,0);else window.scrollTo(0,y)}

function renderMeta(){if(offline){meta.textContent='geen verbinding met de exporter';return}
  if(!D||!D.scanned){meta.textContent='clusterbusters · eerste scan loopt';return}
  meta.innerHTML=`<span class="live">clusterbusters · OpenShift ${esc(D.currentVersion||'onbekend')}${D.targetVersion?` → ${esc(D.targetVersion)}`:''} · live</span>`}

async function load(){
  try{const r=await fetch('api/status',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
    const prev=D;D=await r.json();fetchedAt=Date.now();offline=false;
    if(prev&&prev.scanned)lastScore=prev.score;
    // Alleen opnieuw tekenen als er een nieuwe scan is, anders springt de pagina elke 15 seconden.
    if(!prev||prev.lastScan!==D.lastScan||prev.scanned!==D.scanned)render(false)}
  catch(e){if(!offline){offline=true;if(!D)render(false)}}
  renderMeta()}

addEventListener('hashchange',()=>render(true));
addEventListener('resize',()=>document.querySelectorAll('.seg').forEach(placeSeg));
addEventListener('scroll',()=>document.getElementById('top').classList.toggle('scrolled',scrollY>8),{passive:true});
// De leeftijd van de scan telt door tussen twee verversingen.
setInterval(()=>{const a=document.getElementById('age');if(a)a.textContent=ageText(ageNow())},1000);
// Thema: geen keuze betekent volgen wat het systeem zegt.
const th=document.getElementById('theme');
function setTheme(v){document.documentElement.dataset.theme=v;th.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));placeSeg(th)}
let saved=null;try{saved=localStorage.getItem('cb-theme')}catch(e){}
setTheme(saved||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
th.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;setTheme(b.dataset.v);try{localStorage.setItem('cb-theme',b.dataset.v)}catch(e){}});
render(true);load();setInterval(load,REFRESH_MS);
document.fonts?.ready.then(()=>{placeSeg(th);document.querySelectorAll('#app .seg').forEach(placeSeg)});
</script>
</body>
</html>

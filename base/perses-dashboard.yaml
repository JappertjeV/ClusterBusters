apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: upgrade-readiness
spec:
  config:
    display:
      name: "ClusterBusters: OpenShift Upgrade Readiness"
      description: "Is this cluster ready for the next upgrade? Fix red first, review orange, green is fine. Extended view: the exporter page (oc get route upgrade-readiness -n clusterbusters)."
    duration: 1h
    # Zonder dit vraagt Perses alleen bij het laden data op: "Last scan" bleef op 54s staan terwijl
    # de exporter gewoon doorscande.
    refreshInterval: 30s
    # Vast kleurenschema: groen #00c300/#00a800, rood #c01313, oranje #ff8811/#e3660e.
    # Op #c01313 kiest de StatChart witte tekst; op lichter rood wordt die zwart en slecht leesbaar.
    panels:
      # --- Readiness: de oordelen van de exporter (upgrade_readiness_*) ---
      readiness-score:
        kind: Panel
        spec:
          display:
            name: "Readiness score"
            description: "100 minus 25 per blocker and 5 per warning, minimum 0."
          plugin:
            kind: GaugeChart
            spec:
              calculation: last
              max: 100
              format:
                unit: decimal
                decimalPlaces: 0
              thresholds:
                defaultColor: "#c01313"
                steps:
                  - value: 50
                    color: "#ff8811"
                  - value: 100
                    color: "#00c300"
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    # Samengevoegd omdat elke pod een eigen serie levert: na een herstart stond elke tegel anders dubbel.
                    query: max(upgrade_readiness_score)
                    # Zonder naam toont Perses de lege labelset "{}" onder de meter.
                    seriesNameFormat: "Score"

      readiness-ready:
        kind: Panel
        spec:
          display:
            name: "Ready for upgrade?"
            description: "Yes if there are no blockers and all checks succeeded."
          plugin:
            kind: StatChart
            spec:
              calculation: last
              colorMode: background_solid
              thresholds:
                defaultColor: "#c01313"
                steps:
                  - value: 1
                    color: "#00c300"
              mappings:
                - kind: Value
                  spec:
                    value: "0"
                    result:
                      value: "Not yet"
                - kind: Value
                  spec:
                    value: "1"
                    result:
                      value: "Yes"
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: min(upgrade_readiness_ready)

      readiness-blockers:
        kind: Panel
        spec:
          display:
            name: "Blockers"
            description: "Must be resolved before you upgrade."
          plugin:
            kind: StatChart
            spec:
              calculation: last
              colorMode: value
              thresholds:
                defaultColor: "#00a800"
                steps:
                  - value: 1
                    color: "#c01313"
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: sum(max by (category, severity) (upgrade_readiness_findings{severity="blocker"}))

      readiness-warnings:
        kind: Panel
        spec:
          display:
            name: "Warnings"
            description: "Review these before you upgrade; they do not necessarily stop an upgrade."
          plugin:
            kind: StatChart
            spec:
              calculation: last
              colorMode: value
              thresholds:
                defaultColor: "#00a800"
                steps:
                  - value: 1
                    color: "#e3660e"
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: sum(max by (category, severity) (upgrade_readiness_findings{severity="warning"}))

      readiness-scan-age:
        kind: Panel
        spec:
          display:
            name: "Last scan"
            description: "Seconds since the last completed scan. A high value means the figures above are out of date."
          plugin:
            kind: StatChart
            spec:
              calculation: last
              colorMode: value
              format:
                unit: seconds
              thresholds:
                defaultColor: "#00a800"
                steps:
                  - value: 600
                    color: "#c01313"
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: time() - max(upgrade_readiness_last_scan_timestamp_seconds)

      readiness-version:
        kind: Panel
        spec:
          display:
            name: "Version"
            description: "Current cluster version and the target version the checks are assessed against. The target follows the cluster version automatically, unless TARGET_VERSION is set."
          plugin:
            kind: Table
            spec:
              density: compact
              defaultColumnHidden: true
              columnSettings:
                - name: current_version
                  header: Current
                - name: target_version
                  header: Target
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: max by (current_version, target_version) (upgrade_readiness_version_info)

      readiness-fixes:
        kind: Panel
        spec:
          display:
            name: "What needs fixing"
            description: "All findings from the last scan, each with its fix."
          plugin:
            kind: Table
            spec:
              density: comfortable
              defaultColumnHidden: true
              # De titel en de fix zijn lange zinnen; met een vaste rijhoogte vallen ze weg.
              defaultColumnHeight: auto
              enableFiltering: true
              columnSettings:
                - name: severity
                  header: Severity
                  width: 100
                  # Alfabetisch staat blocker bovenaan.
                  sort: asc
                  cellSettings:
                    - condition:
                        kind: Value
                        spec:
                          value: blocker
                      text: Blocker
                      backgroundColor: "#c01313"
                      textColor: "#ffffff"
                    - condition:
                        kind: Value
                        spec:
                          value: warning
                      text: Warning
                      backgroundColor: "#ff8811"
                      textColor: "#131313"
                    - condition:
                        kind: Value
                        spec:
                          value: info
                      text: Info
                      backgroundColor: "#e5f0fd"
                      textColor: "#13417e"
                - name: category
                  header: Category
                  width: 130
                - name: resource
                  header: Resource
                  width: 260
                - name: title
                  header: Problem
                - name: fix
                  header: Fix
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: max by (check, category, severity, resource, title, fix) (upgrade_readiness_finding)

      readiness-score-history:
        kind: Panel
        spec:
          display:
            name: "Score over time"
            description: "Rises as findings are resolved. Dotted lines: the thresholds of the score gauge."
          plugin:
            kind: TimeSeriesChart
            spec:
              yAxis:
                min: 0
                max: 100
              visual:
                lineWidth: 3
                areaOpacity: 0.15
              querySettings:
                - queryIndex: 0
                  colorMode: fixed-single
                  colorValue: "#00c300"
              thresholds:
                defaultColor: "#c01313"
                steps:
                  - value: 50
                    color: "#ff8811"
                    name: "Orange from 50"
                  - value: 100
                    color: "#00a800"
                    name: "Green at 100"
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    # Samengevoegd omdat elke pod een eigen serie levert: na een herstart stond elke tegel anders dubbel.
                    query: max(upgrade_readiness_score)
                    seriesNameFormat: "Score"

      readiness-by-category:
        kind: Panel
        spec:
          display:
            name: "Blockers and warnings per category"
            description: "Counts blockers and warnings only, not info."
          plugin:
            kind: BarChart
            spec:
              calculation: last
              sort: desc
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: sum by (category) (max by (category, severity) (upgrade_readiness_findings{severity=~"blocker|warning"}))
                    seriesNameFormat: "{{category}}"

      readiness-checks:
        kind: Panel
        spec:
          display:
            name: "Check status"
            description: "A failing check means the exporter could not assess this part, usually because of missing permissions."
          plugin:
            kind: Table
            spec:
              density: compact
              defaultColumnHidden: true
              columnSettings:
                - name: check
                  header: Check
                  sort: asc
                - name: value
                  header: Status
                  width: 90
                  cellSettings:
                    - condition:
                        kind: Value
                        spec:
                          value: "1"
                      text: OK
                      backgroundColor: "#00c300"
                      textColor: "#131313"
                    - condition:
                        kind: Value
                        spec:
                          value: "0"
                      text: Failed
                      backgroundColor: "#c01313"
                      textColor: "#ffffff"
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: min by (check) (upgrade_readiness_check_up)

      # --- Bovenste rij: Status Tellers (StatChart) ---
      stat-blocking-pdbs:
        kind: Panel
        spec:
          display:
            name: "Blocking PDBs"
            description: "Number of PDBs that allow 0 evictions. Blocks node drains during upgrades."
          plugin:
            kind: StatChart
            spec:
              calculation: last
              colorMode: value
              thresholds:
                defaultColor: "#00a800"
                steps:
                  - value: 1
                    color: "#c01313"
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: count(kube_poddisruptionbudget_status_pod_disruptions_allowed == 0) or vector(0)

      stat-unready-nodes:
        kind: Panel
        spec:
          display:
            name: "Nodes not Ready"
            description: "Number of cluster nodes whose Ready condition is not 'true'."
          plugin:
            kind: StatChart
            spec:
              calculation: last
              colorMode: value
              thresholds:
                defaultColor: "#00a800"
                steps:
                  - value: 1
                    color: "#c01313"
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: count(kube_node_status_condition{condition="Ready", status!="true"} == 1) or vector(0)

      stat-unhealthy-operators:
        kind: Panel
        spec:
          display:
            name: "Unhealthy Operators"
            description: "Number of Cluster Operators that are down, degraded or unavailable."
          plugin:
            kind: StatChart
            spec:
              calculation: last
              colorMode: value
              thresholds:
                defaultColor: "#00a800"
                steps:
                  - value: 1
                    color: "#c01313"
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    # cluster_operator_conditions heeft geen status-label: de waarde zelf is 1 of 0.
                    # group by (name) telt een operator met meerdere problemen maar een keer.
                    query: count(group by (name) (cluster_operator_up == 0 or cluster_operator_conditions{condition="Degraded"} == 1 or cluster_operator_conditions{condition="Available"} == 0)) or vector(0)

      stat-deprecated-apis:
        kind: Panel
        spec:
          display:
            name: "Deprecated APIs in use"
            description: "Number of API versions that actually have a planned removal release."
          plugin:
            kind: StatChart
            spec:
              calculation: last
              colorMode: value
              thresholds:
                defaultColor: "#00a800"
                steps:
                  - value: 1
                    color: "#e3660e"
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    # Deze metric is een gauge die op 1 blijft staan, dus rate() geeft altijd 0.
                    query: count(count by (group, version, resource) (apiserver_requested_deprecated_apis{removed_release=~".+"})) or vector(0)

      # --- Details: tabellen, omdat deze queries altijd 1 geven en een lijngrafiek dan alleen lijnen op 1 toont ---
      pdbs-blocking-detail:
        kind: Panel
        spec:
          display:
            name: "PDBs with 0 disruptions"
            description: "PDBs per namespace that prevent drains. Empty is good."
          plugin:
            kind: Table
            spec:
              density: compact
              defaultColumnHidden: true
              columnSettings:
                - name: namespace
                  header: Namespace
                - name: poddisruptionbudget
                  header: PDB
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: count by (namespace, poddisruptionbudget) (kube_poddisruptionbudget_status_pod_disruptions_allowed == 0)
                    seriesNameFormat: "{{namespace}}/{{poddisruptionbudget}}"

      nodes-unready-detail:
        kind: Panel
        spec:
          display:
            name: "Nodes not Ready"
            description: "Nodes that are not in Ready status. Empty is good."
          plugin:
            kind: Table
            spec:
              density: compact
              defaultColumnHidden: true
              columnSettings:
                - name: node
                  header: Node
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: sum by (node) (kube_node_status_condition{condition="Ready", status!="true"} == 1)
                    seriesNameFormat: "{{node}}"

      unhealthy-operators-detail:
        kind: Panel
        spec:
          display:
            name: "Degraded Operators"
            description: "Degraded OpenShift Cluster Operators. Empty is good."
          plugin:
            kind: Table
            spec:
              density: compact
              defaultColumnHidden: true
              columnSettings:
                - name: name
                  header: Operator
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: sum by (name) (cluster_operator_conditions{condition="Degraded"} == 1)
                    seriesNameFormat: "{{name}}"

      deprecated-apis-detail:
        kind: Panel
        spec:
          display:
            name: "Deprecated APIs in use"
            description: "Called deprecated API versions with a planned removal release."
          plugin:
            kind: Table
            spec:
              density: compact
              defaultColumnHidden: true
              columnSettings:
                - name: group
                  header: Group
                  cellSettings:
                    # De kern-API's hebben geen group-label.
                    - condition:
                        kind: Misc
                        spec:
                          value: empty
                      text: core
                - name: version
                  header: Version
                - name: resource
                  header: Resource
                - name: removed_release
                  header: Removed in
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: count by (group, version, resource, removed_release) (apiserver_requested_deprecated_apis{removed_release=~".+"})
                    seriesNameFormat: "{{group}}/{{version}} {{resource}} (removed in: {{removed_release}})"

    layouts:
      - kind: Grid
        spec:
          display:
            title: "Overview"
            collapse:
              open: true
          items:
            # Vijf tellers over de volle breedte van 24
            - x: 0
              y: 0
              width: 5
              height: 6
              content:
                $ref: "#/spec/panels/readiness-score"
            - x: 5
              y: 0
              width: 5
              height: 6
              content:
                $ref: "#/spec/panels/readiness-ready"
            - x: 10
              y: 0
              width: 3
              height: 6
              content:
                $ref: "#/spec/panels/readiness-blockers"
            - x: 13
              y: 0
              width: 3
              height: 6
              content:
                $ref: "#/spec/panels/readiness-warnings"
            - x: 16
              y: 0
              width: 4
              height: 6
              content:
                $ref: "#/spec/panels/readiness-scan-age"
            - x: 20
              y: 0
              width: 4
              height: 6
              content:
                $ref: "#/spec/panels/readiness-version"
      - kind: Grid
        spec:
          display:
            title: "What needs fixing"
            collapse:
              open: true
          items:
            - x: 0
              y: 0
              width: 24
              height: 16
              content:
                $ref: "#/spec/panels/readiness-fixes"
      - kind: Grid
        spec:
          display:
            title: "Score and checks"
            collapse:
              open: true
          items:
            - x: 0
              y: 0
              width: 10
              height: 8
              content:
                $ref: "#/spec/panels/readiness-score-history"
            - x: 10
              y: 0
              width: 7
              height: 8
              content:
                $ref: "#/spec/panels/readiness-by-category"
            - x: 17
              y: 0
              width: 7
              height: 8
              content:
                $ref: "#/spec/panels/readiness-checks"
      - kind: Grid
        spec:
          # Deze metrics komen rechtstreeks van het platform, en tellen dus ook platform-namespaces
          # mee die de exporter overslaat. Verschillen met de tellers hierboven kunnen dus kloppen.
          # Ingeklapt, zodat de demo begint bij de oordelen van de exporter.
          display:
            title: "Raw platform metrics"
            collapse:
              open: false
          items:
            # Bovenste rij: 4 stat blokken (breedte 6 per stuk = 24 breedte)
            - x: 0
              y: 0
              width: 6
              height: 4
              content:
                $ref: "#/spec/panels/stat-blocking-pdbs"
            - x: 6
              y: 0
              width: 6
              height: 4
              content:
                $ref: "#/spec/panels/stat-unready-nodes"
            - x: 12
              y: 0
              width: 6
              height: 4
              content:
                $ref: "#/spec/panels/stat-unhealthy-operators"
            - x: 18
              y: 0
              width: 6
              height: 4
              content:
                $ref: "#/spec/panels/stat-deprecated-apis"

            # Rij 2: API-tabel breed, want die heeft vier kolommen en nu ook echt inhoud
            - x: 0
              y: 4
              width: 24
              height: 8
              content:
                $ref: "#/spec/panels/deprecated-apis-detail"

            # Rij 3: drie tabellen die normaal leeg zijn (breedte 8 per stuk)
            - x: 0
              y: 12
              width: 8
              height: 6
              content:
                $ref: "#/spec/panels/pdbs-blocking-detail"
            - x: 8
              y: 12
              width: 8
              height: 6
              content:
                $ref: "#/spec/panels/nodes-unready-detail"
            - x: 16
              y: 12
              width: 8
              height: 6
              content:
                $ref: "#/spec/panels/unhealthy-operators-detail"

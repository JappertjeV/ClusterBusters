apiVersion: monitoring.rhobs/v1alpha1
kind: MonitoringStack
metadata:
  name: readiness-stack
spec:
  logLevel: info
  retention: 1d
  resourceSelector:
    matchLabels:
      app: upgrade-readiness      # zelfde label dat jullie overlay al overal op zet
  prometheusConfig:
    replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

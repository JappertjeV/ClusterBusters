apiVersion: apps/v1
kind: Deployment
metadata:
  name: upgrade-readiness-exporter
  labels:
    app.kubernetes.io/name: upgrade-readiness-exporter
spec:
  # Het eerste image is gebouwd (build 3). Op een nieuw cluster eerst bouwen, anders geeft het
  # ontbrekende image ImagePullBackOff. Zie exporter/README.md.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: upgrade-readiness-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: upgrade-readiness-exporter
    spec:
      serviceAccountName: upgrade-readiness-exporter
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          # Vast registry-pad in plaats van een image.openshift.io/triggers-annotatie: die
          # annotatie herschrijft dit veld, waarna selfHeal van Argo CD het weer terugzet.
          image: image-registry.openshift-image-registry.svc:5000/clusterbusters/upgrade-readiness-exporter:latest
          # Nodig omdat de tag latest bij elke build naar een nieuw image wijst.
          imagePullPolicy: Always
          env:
            # Leeg: de exporter neemt de minor na de huidige clusterversie, dus bij elke nieuwe
            # OpenShift-versie schuift het doel vanzelf mee. Zet hier bv. "4.20" om tegen een
            # vaste versie te beoordelen (handig om een sprong over meerdere minors te checken).
            - name: TARGET_VERSION
              value: ""
            - name: INCLUDE_PLATFORM
              value: "false"
            - name: SCAN_INTERVAL
              value: "60"
            # Bekende punten die we bewust accepteren: ze blijven zichtbaar als info, maar tellen niet
            # mee in score en ready. Reguliere expressies, gescheiden door ;, gezocht in
            # "<check>/<resource>: <title>". Leeg = niets geaccepteerd.
            # Op CRC: (1) CRC zet zelf overrides in de ClusterVersion, waardoor die Upgradeable=False meldt;
            # (2) het platform roept zelf de DeploymentConfig-API aan, die pas in OpenShift 6.0 verdwijnt.
            # Haal deze waarde weg op een echt cluster: daar zijn dit wel punten om op te lossen.
            - name: ACCEPTED_FINDINGS
              value: 'clusterversion/ClusterVersion version: Cluster is not upgradeable: .*overrides;deprecated_apis/.*deploymentconfigs\.v1\.apps\.openshift\.io:'
          ports:
            - name: metrics
              containerPort: 8080
          # tcpSocket in plaats van GET /metrics: een probe mag geen dure clusterrondgang starten.
          readinessProbe:
            tcpSocket:
              port: metrics
          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              # Op 128Mi werd de pod 76 keer OOMKilled (5-6 nov), en elke crash wist de score-historie.
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: upgrade-readiness-exporter
  labels:
    app.kubernetes.io/name: upgrade-readiness-exporter
spec:
  selector:
    app.kubernetes.io/name: upgrade-readiness-exporter
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
---
# monitoring.coreos.com en niet monitoring.rhobs: alleen dan pakt user workload monitoring dit
# op. Zo komen de metrics in thanos-querier terecht, en daarmee in het dashboard.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: upgrade-readiness-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: upgrade-readiness-exporter
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s

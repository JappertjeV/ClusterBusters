# De Cluster Observability Operator levert Perses en de UIPlugin. Overgenomen van het draaiende
# cluster, zodat de eerste sync van Argo CD niets aan de Operator verandert.
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-cluster-observability-operator
  labels:
    openshift.io/cluster-monitoring: "true"
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  # Deze naam komt uit de console-installatie. Niet wijzigen: een tweede OperatorGroup in deze
  # namespace laat OLM falen met TooManyOperatorGroups.
  name: openshift-cluster-observability-operator-hsxnm
  namespace: openshift-cluster-observability-operator
spec:
  upgradeStrategy: Default
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: cluster-observability-operator
  namespace: openshift-cluster-observability-operator
spec:
  channel: stable
  installPlanApproval: Automatic
  name: cluster-observability-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  startingCSV: cluster-observability-operator.v1.5.4

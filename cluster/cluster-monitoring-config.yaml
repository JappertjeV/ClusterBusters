# Zet user workload monitoring aan, zodat onze eigen exporter gescrapet kan worden.
# Argo CD rolt dit uit via argocd/application-cluster.yaml.
#
# Staat bewust buiten base/. De overlay in overlays/prod zet alles in namespace
# clusterbusters, en dit bestand moet in openshift-monitoring blijven staan.
#
# Vereist ingebouwde monitoring. Op CRC staat die standaard uit: zie docs/cluster-opzetten.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-monitoring-config
  namespace: openshift-monitoring
data:
  config.yaml: |
    enableUserWorkload: true

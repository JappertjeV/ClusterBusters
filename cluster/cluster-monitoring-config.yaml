# Zet user workload monitoring aan, zodat onze eigen exporter gescrapet kan worden.
# Eenmalig met de hand toepassen: oc apply -f cluster/
#
# Staat bewust buiten base/ en k8s/. De overlay in overlays/prod zet alles in namespace
# perses-system, en dit bestand moet in openshift-monitoring blijven staan.
#
# Vereist ingebouwde monitoring. Op CRC staat die standaard uit: haal daarvoor de overrides
# cluster-monitoring-operator en monitoring uit ClusterVersion.spec.overrides.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-monitoring-config
  namespace: openshift-monitoring
data:
  config.yaml: |
    enableUserWorkload: true

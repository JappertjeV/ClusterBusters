# Start de Perses-server en zet Perses-dashboards in de OpenShift-console.
# Argo CD rolt dit uit via argocd/application-cluster.yaml, met het recht uit argocd/rbac.yaml.
#
# Vereist de Cluster Observability Operator; getest met versie 1.5.4. Die verwijderde hierbij
# de RoleBinding prometheus-k8s in zijn eigen namespace, zonder zichtbaar effect op het scrapen.
apiVersion: observability.openshift.io/v1alpha1
kind: UIPlugin
metadata:
  name: monitoring
  annotations:
    # Pas na de Operator: op een nieuw cluster bestaat deze CRD daarvoor nog niet.
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingKind=true
spec:
  type: Monitoring
  monitoring:
    perses:
      enabled: true

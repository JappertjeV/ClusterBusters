# Kleine testapp om de GitOps-uitrol echt te controleren: met een lege k8s/ meldde
# Argo CD Synced/Healthy terwijl er niets draaide. Verwijder dit bestand als er een
# echte workload staat.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testapp
  labels:
    app: testapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: testapp
  template:
    metadata:
      labels:
        app: testapp
    spec:
      containers:
        - name: nginx
          # De unprivileged-variant luistert op 8080 en draait als niet-root. De gewone
          # nginx-image wil poort 80 en root, en dat staat OpenShift standaard niet toe.
          image: docker.io/nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          # Voldoet aan de SCC restricted-v2, zodat OpenShift de pod zonder extra rechten toelaat.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: testapp
  labels:
    app: testapp
spec:
  selector:
    app: testapp
  ports:
    - port: 8080
      targetPort: 8080
---
# Zonder host kiest OpenShift zelf de hostnaam op basis van naam en namespace.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: testapp
  labels:
    app: testapp
spec:
  to:
    kind: Service
    name: testapp
  port:
    targetPort: 8080

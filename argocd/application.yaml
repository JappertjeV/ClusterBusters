# Argo CD-Application: synchroniseert overlays/prod van de main-branch
# naar het cluster waarop Argo CD draait. Eenmalig toepassen, daarna is git leidend:
#   oc apply -n openshift-gitops -f argocd/application.yaml
#
# Niet via een app in de UI met pad argocd/ laten lopen: die behandelt dit bestand als
# zijn eigen manifest, en overschrijft zichzelf als hij ook clusterbusters heet.
#
# Dit bestand staat buiten base/ en overlays/, omdat Argo CD zijn eigen Application anders
# mee zou synchroniseren.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clusterbusters
  # Argo CD leest Applications standaard alleen uit zijn eigen namespace. Bij OpenShift
  # GitOps is dat openshift-gitops; met `argocd` faalde de sync op
  # "applications.argoproj.io is forbidden".
  namespace: openshift-gitops
  # Bewust geen resources-finalizer: `kubectl delete` op deze Application mag de
  # draaiende workloads niet meenemen.
spec:
  project: default
  source:
    # Publieke repo, dus er is geen repository-Secret nodig.
    repoURL: https://github.com/JappertjeV/ClusterBusters.git
    targetRevision: main
    path: overlays/prod
  destination:
    # Het cluster waarop Argo CD zelf draait.
    server: https://kubernetes.default.svc
    namespace: clusterbusters
  syncPolicy:
    automated:
      # Uit git verwijderd is uit het cluster verwijderd. allowEmpty staat standaard
      # uit, dus een per ongeluk geleegde overlay haalt niet alles in een keer weg.
      prune: true
      # Handmatige wijzigingen in het cluster terugdraaien, zodat git leidend blijft.
      selfHeal: true
    # De OpenShift GitOps-controller krijgt pas rechten in een namespace met dit label.
    managedNamespaceMetadata:
      labels:
        argocd.argoproj.io/managed-by: openshift-gitops
    syncOptions:
      # De namespace staat niet in de manifests, dus Argo CD moet hem zelf kunnen aanmaken.
      - CreateNamespace=true
